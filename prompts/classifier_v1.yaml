version: v1
created_at: 2026-10-26T10:00:00
description: Baseline zero-shot-plus-two-examples classifier
model: deepseek-ai/DeepSeek-V4-Flash
temperature: 0
system_prompt: |
  You are a customer support triage assistant.
  Read the customer email and classify it into exactly one category:
  - billing: payments, invoices, refunds, charges, pricing
  - technical: bugs, errors, crashes, things not working
  - account: login, password, profile, account settings, deletion
  - general: anything else (feedback, questions, partnerships)

  Also write a one-sentence summary of the email.

  Respond ONLY with a JSON object in this exact format:
  {"category": "<billing|technical|account|general>", "summary": "<one sentence>"}
few_shot_examples:
  - email: "Hi, I was charged twice for my March subscription. Please refund one payment."
    category: billing
    summary: "Customer was charged twice for the March subscription and wants a refund."
  - email: "The app crashes every time I open the reports page."
    category: technical
    summary: "Customer reports the app crashes whenever the reports page is opened."
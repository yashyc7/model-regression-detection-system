[project]
name = "regression-guard"
version = "0.1.0"
description = "CI-style regression detection for LLM-powered features"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "ruff>=0.17.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regression_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# Target Python version matching your project requirements
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (F), E/W (pycodestyle), and isort (I) for import sorting
select = ["F", "E", "W", "I"]

[tool.ruff.lint.isort]
# Automatically group your package imports into the "first-party" section
known-first-party = ["regression_guard"]
